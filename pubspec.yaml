name: merkez_zihin_antrenmani
description: "Zihin Antrenmanı merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 05acd1e648dcb04c962281272f3fb806fc9ccc99
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_gunluk_beyin_egzersizi_programi:
    git:
      url: https://github.com/taktemurr-ops/oyun-gunluk-beyin-egzersizi-programi
      ref: c78e5fb09c7429d97bd9694c8ede9369f6e077ee
  oyun_hafiza_dizisi:
    git:
      url: https://github.com/taktemurr-ops/oyun-hafiza-dizisi
      ref: eb9a0e1250c0f4bff48a86a33a234b97b4698b9c
  oyun_gorsel_hafiza_izgarasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-gorsel-hafiza-izgarasi
      ref: a842a49368dfb07714d8739843989dc228cd7880
  oyun_n_geri:
    git:
      url: https://github.com/taktemurr-ops/oyun-n-geri
      ref: ea3ed3547c80788b07584e54d5a0690cc799ab95
  oyun_yuz_ve_isim:
    git:
      url: https://github.com/taktemurr-ops/oyun-yuz-ve-isim
      ref: 74a621875cb62b7c79d235376e2c64b9db52c0c2
  oyun_stroop_testi:
    git:
      url: https://github.com/taktemurr-ops/oyun-stroop-testi
      ref: 455e18b229ef2cc1e4d08372878619d253245406
  oyun_schulte_tablosu:
    git:
      url: https://github.com/taktemurr-ops/oyun-schulte-tablosu
      ref: b0038996188ee4f5afde5143dce5d59a09857b68
  oyun_tepki_ve_odak:
    git:
      url: https://github.com/taktemurr-ops/oyun-tepki-ve-odak
      ref: 4cf41925baf63ec34becca7a64e02f8829241d56
  oyun_hizli_hesap:
    git:
      url: https://github.com/taktemurr-ops/oyun-hizli-hesap
      ref: a6a0f648fd3742d7aa8a8f8a4560da31f3fb45e4
  oyun_cift_gorev:
    git:
      url: https://github.com/taktemurr-ops/oyun-cift-gorev
      ref: cbf34fcc2540d45117e407ff7e4ce7b4c105cac8
  oyun_oruntu_tamamlama:
    git:
      url: https://github.com/taktemurr-ops/oyun-oruntu-tamamlama
      ref: 6bec5b402820ad1fcd516d7bee0654f0d387e9fa
  oyun_uzamsal_dondurme:
    git:
      url: https://github.com/taktemurr-ops/oyun-uzamsal-dondurme
      ref: f6d796808747b58019374fb7d4b1ea189a8bc436
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve zihin motoru sürümünü kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 05acd1e648dcb04c962281272f3fb806fc9ccc99
  zihin_motoru:
    git:
      url: https://github.com/taktemurr-ops/zihin-motoru
      ref: b1fd9cdfe264bfd4cf91677ec7b32826f7748bb9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
