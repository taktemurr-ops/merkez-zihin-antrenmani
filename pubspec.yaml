  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve zihin motoru sürümünü kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 14dac3f9192e77fda961b85d5bc33d2effb12f4d
  zihin_motoru:
    git:
      url: https://github.com/taktemurr-ops/zihin-motoru
      ref: 41e139d41a39b2bdc9365fddb6b78239959b414b

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/approved/
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
