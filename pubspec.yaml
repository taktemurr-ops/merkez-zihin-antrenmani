  oyun_rakam_dizisi:
    git:
      url: https://github.com/taktemurr-ops/oyun-rakam-dizisi
      ref: main
  oyun_gorsel_arama:
    git:
      url: https://github.com/taktemurr-ops/oyun-gorsel-arama
      ref: main
  oyun_kelime_hafizasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-kelime-hafizasi
      ref: main
  oyun_oruntu_tamamlama:
    git:
      url: https://github.com/taktemurr-ops/oyun-oruntu-tamamlama
      ref: 6bec5b402820ad1fcd516d7bee0654f0d387e9fa
  oyun_uzamsal_dondurme:
    git:
      url: https://github.com/taktemurr-ops/oyun-uzamsal-dondurme
