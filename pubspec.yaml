    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 14dac3f9192e77fda961b85d5bc33d2effb12f4d
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_gunluk_beyin_egzersizi_programi:
    git:
      url: https://github.com/taktemurr-ops/oyun-gunluk-beyin-egzersizi-programi
      ref: c78e5fb09c7429d97bd9694c8ede9369f6e077ee
  oyun_hafiza_dizisi:
    git:
      url: https://github.com/taktemurr-ops/oyun-hafiza-dizisi
      ref: eb9a0e1250c0f4bff48a86a33a234b97b4698b9c
  oyun_gorsel_hafiza_izgarasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-gorsel-hafiza-izgarasi
      ref: a842a49368dfb07714d8739843989dc228cd7880
  oyun_n_geri:
    git:
      url: https://github.com/taktemurr-ops/oyun-n-geri
      ref: ea3ed3547c80788b07584e54d5a0690cc799ab95
  oyun_yuz_ve_isim:
