name: merkez_zihin_antrenmani
description: "Zihin Antrenmanı merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 71553283c36d7f672f375de54219020461cead06
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_gunluk_beyin_egzersizi_programi:
    git:
      url: https://github.com/taktemurr-ops/oyun-gunluk-beyin-egzersizi-programi
      ref: main
  oyun_hafiza_dizisi:
    git:
      url: https://github.com/taktemurr-ops/oyun-hafiza-dizisi
      ref: main
  oyun_gorsel_hafiza_izgarasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-gorsel-hafiza-izgarasi
      ref: main
  oyun_n_geri:
    git:
      url: https://github.com/taktemurr-ops/oyun-n-geri
      ref: main
  oyun_stroop_testi:
    git:
      url: https://github.com/taktemurr-ops/oyun-stroop-testi
      ref: main
  oyun_schulte_tablosu:
    git:
      url: https://github.com/taktemurr-ops/oyun-schulte-tablosu
      ref: main
  oyun_tepki_ve_odak:
    git:
      url: https://github.com/taktemurr-ops/oyun-tepki-ve-odak
      ref: main
  oyun_hizli_hesap:
    git:
      url: https://github.com/taktemurr-ops/oyun-hizli-hesap
      ref: main
  oyun_oruntu_tamamlama:
    git:
      url: https://github.com/taktemurr-ops/oyun-oruntu-tamamlama
      ref: main
  oyun_uzamsal_dondurme:
    git:
      url: https://github.com/taktemurr-ops/oyun-uzamsal-dondurme
      ref: main
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve zihin motoru sürümünü kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 71553283c36d7f672f375de54219020461cead06
  zihin_motoru:
    git:
      url: https://github.com/taktemurr-ops/zihin-motoru
      ref: 1f590118716c156f8ba02b3db968ab218240dd31

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
