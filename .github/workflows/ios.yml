name: iOS build

# Runs on every push to main (macOS runners are free for public
# repositories), on release tags and on demand. If the repository is made
# private again, macOS minutes cost 10x Linux minutes: remove the
# `branches` line to keep iOS builds for tags / manual runs only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          flutter create --platforms=android,ios,web --org com.gamestudio100 --project-name merkez_zihin_antrenmani .
          python tool/patch_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols/ios
      - name: Dependency vulnerabilities (osv-scanner, Podfile.lock + pubspec.lock; report only)
        continue-on-error: true
        run: |
          curl -sSLo "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_darwin_arm64
          echo "b22c02877a811c8f78956e8643efa554932b7378f590d13f8e97d4e9448a29f3  $RUNNER_TEMP/osv-scanner" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile=ios/Podfile.lock --lockfile=pubspec.lock --format=table || true
      - name: Package Runner.app
        run: cd build/ios/iphoneos && zip -qr ../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merkez-zihin-antrenmani-ios-unsigned
          path: Runner-unsigned.zip
          retention-days: 14
