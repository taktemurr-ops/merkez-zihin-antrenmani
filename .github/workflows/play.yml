# Google Play yayını: imzalı AAB -> "internal" (dahili test) kanalı, mağaza
# metinleri (33 dil), görseller, sürüm notları ve R8 eşleme dosyası.
# Ayrıca yandan yükleme testleri için imzalı evrensel + ABI başına APK'ler.
#
# Gizli değişkenler (hepsi yoksa iş akışı yeşil olarak atlanır):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD  -> imzalı derleme (AAB + APK'ler)
#   PLAY_JSON_KEY         -> Play'e yükleme (hizmet hesabı JSON içeriği)
# İsteğe bağlı: ADMOB_*, FIREBASE_* (ci.yml ile aynı adlar).
# Ayrıntı: CANLI_HAZIRLIK.md (stüdyo belgesi).
#
# Sürüm kodu: 2024-01-01'den bu yana geçen dakika (her yüklemede artar,
# yeniden adlandırma/yeniden çalıştırmadan etkilenmez).
# Sürüm adı: "v1.2.3" etiketi -> 1.2.3; aksi halde pubspec.yaml sürümü.
name: "Yayın - Google Play"

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Kanal: internal (dahili test), alpha (kapalı), beta (açık), production"
        default: internal
      metadata:
        description: "Mağaza metinlerini ve görsellerini de yükle"
        type: boolean
        default: true
      test_build:
        description: "Gizli değişken olmadan derleme yolunu dene (hata ayıklama imzası, yükleme yok)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"
  HUB: merkez-zihin-antrenmani
  PACKAGE: com.gamestudio100.merkez_zihin_antrenmani

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.g.outputs.build }}
      signed: ${{ steps.g.outputs.signed }}
      play: ${{ steps.g.outputs.play }}
      code: ${{ steps.v.outputs.code }}
      name: ${{ steps.v.outputs.name }}
      track: ${{ steps.g.outputs.track }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Gizli değişkenler tanımlı mı
        id: g
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
          TEST_BUILD: ${{ inputs.test_build }}
          TRACK: ${{ inputs.track }}
        run: |
          missing=""
          for n in KS_B64:ANDROID_KEYSTORE_BASE64 KS_PASS:ANDROID_KEYSTORE_PASSWORD KEY_ALIAS:ANDROID_KEY_ALIAS KEY_PASS:ANDROID_KEY_PASSWORD; do
            v="${n%%:*}"; [ -n "${!v}" ] || missing="$missing ${n#*:}"
          done
          signed=0; [ -z "$missing" ] && signed=1
          play=0; [ "$signed" = 1 ] && [ -n "$PLAY_JSON_KEY" ] && play=1
          build=$signed; [ "$TEST_BUILD" = "true" ] && build=1
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "play=$play" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "track=${TRACK:-internal}" >> "$GITHUB_OUTPUT"
          {
            echo "### Google Play yayını"
            if [ "$signed" = 1 ]; then echo "- İmza anahtarı: var"; else echo "- İmza anahtarı: YOK (eksik:$missing) -> imzalı derleme atlandı"; fi
            if [ "$play" = 1 ]; then echo "- PLAY_JSON_KEY: var -> ${TRACK:-internal} kanalına yüklenecek"; else echo "- Play'e yükleme: atlandı (PLAY_JSON_KEY veya imza yok)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$build" = 1 ] || echo "::notice::Gizli değişkenler yok: Google Play yayını atlandı."
      - name: Sürüm numarası
        id: v
        run: |
          code=$(( ( $(date -u +%s) - 1704067200 ) / 60 ))
          name=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml | head -1)
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then name="${BASH_REMATCH[1]}"; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=${name:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "- Sürüm: ${name:-1.0.0} ($code)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: gate
    if: needs.gate.outputs.build == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ needs.gate.outputs.code }}
      VERSION_NAME: ${{ needs.gate.outputs.name }}
      SIGNED: ${{ needs.gate.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Simge, açılış ve ses varlıkları
        run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Yükleme anahtarı (upload key)
        if: env.SIGNED == '1'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Yalnızca dosya yolu ortama yazılır; parolalar yalnız derleme adımına verilir.
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Anahtar deposu açılamadı: ANDROID_KEYSTORE_PASSWORD veya ANDROID_KEY_ALIAS yanlış."; exit 1; }
      - name: Platform klasörleri
        env:
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
        run: |
          flutter create --platforms=android,ios,web --org com.gamestudio100 --project-name merkez_zihin_antrenmani .
          python tool/patch_platforms.py
          grep -q 'applicationId = "com.gamestudio100.merkez_zihin_antrenmani"' android/app/build.gradle.kts \
            || { echo "::error::applicationId beklenen com.gamestudio100.merkez_zihin_antrenmani değil"; grep -n applicationId android/app/build.gradle.kts; exit 1; }
          if [ "$SIGNED" = 1 ]; then grep -q gs100Release android/app/build.gradle.kts || { echo "::error::Yayın imzası Gradle'a eklenmedi"; exit 1; }; fi
      - run: flutter pub get
      - name: Uygulama simgeleri ve açılış ekranı
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: İmzalı AAB + evrensel APK + ABI başına APK
        env:
          AD_INT: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL }}
          AD_REW: ${{ secrets.ADMOB_ANDROID_REWARDED }}
          FB_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_SENDER: ${{ secrets.FIREBASE_SENDER_ID }}
          FB_ANDROID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FB_WEB: ${{ secrets.FIREBASE_WEB_APP_ID }}
          PV_URL: ${{ secrets.PURCHASE_VERIFY_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          DEFS="--dart-define=APP_VERSION=$VERSION_NAME"
          if [ -n "$FB_PROJECT" ]; then
            DEFS="$DEFS --dart-define=FIREBASE_PROJECT_ID=$FB_PROJECT --dart-define=FIREBASE_API_KEY=$FB_KEY --dart-define=FIREBASE_SENDER_ID=$FB_SENDER --dart-define=FIREBASE_ANDROID_APP_ID=$FB_ANDROID --dart-define=FIREBASE_WEB_APP_ID=$FB_WEB"
          fi
          if [ -n "$AD_INT" ]; then DEFS="$DEFS --dart-define=ADMOB_ANDROID_INTERSTITIAL=$AD_INT"; fi
          if [ -n "$AD_REW" ]; then DEFS="$DEFS --dart-define=ADMOB_ANDROID_REWARDED=$AD_REW"; fi
          if [ -n "$PV_URL" ]; then DEFS="$DEFS --dart-define=PURCHASE_VERIFY_URL=$PV_URL"; fi
          COMMON="--release $DEFS --build-number=$VERSION_CODE --build-name=$VERSION_NAME --obfuscate --split-debug-info=build/symbols/android"
          b() { flutter build "$@" $COMMON || (sleep 90 && flutter build "$@" $COMMON) || (sleep 180 && flutter build "$@" $COMMON); }
          mkdir -p out
          b apk
          cp build/app/outputs/flutter-apk/app-release.apk "out/$HUB-$VERSION_NAME-universal.apk"
          b apk --split-per-abi
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/^app-\(.*\)-release.apk$/\1/')
            cp "$f" "out/$HUB-$VERSION_NAME-$abi.apk"
          done
          # AAB en son: R8 eşleme dosyası bu pakete aittir.
          b appbundle
          cp build/app/outputs/bundle/release/app-release.aab "out/$HUB-$VERSION_NAME.aab"
          mkdir -p meta
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then cp build/app/outputs/mapping/release/mapping.txt meta/mapping.txt; fi
          (cd build/symbols && zip -qr ../../meta/dart-symbols.zip .)
          ls -la out meta
      - name: İmza denetimi (hata ayıklama anahtarı Play'e gitmesin)
        if: env.SIGNED == '1'
        run: |
          for f in out/*.aab out/*.apk; do
            info=$(keytool -printcert -jarfile "$f" 2>/dev/null || true)
            if [ -z "$info" ] && [[ "$f" == *.apk ]]; then
              info=$("$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$f" 2>/dev/null || true)
            fi
            if [ -z "$info" ]; then echo "::error::$f imzasız"; exit 1; fi
            if echo "$info" | grep -q "CN=Android Debug"; then echo "::error::$f hata ayıklama anahtarıyla imzalanmış"; exit 1; fi
          done
          echo "İmza denetimi tamam."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.HUB }}-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: out/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.HUB }}-symbols-${{ env.VERSION_CODE }}
          path: meta/
          retention-days: 90
      - name: İmzalı APK'leri GitHub sürümüne koy (yandan yükleme testi)
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            T="${GITHUB_REF#refs/tags/}"
            gh release view "$T" >/dev/null 2>&1 || gh release create "$T" --title "$HUB $VERSION_NAME" --notes "İmzalı sürüm $VERSION_NAME ($VERSION_CODE). Play'e giden paket: .aab"
            gh release upload "$T" out/* --clobber
          else
            gh release view test >/dev/null 2>&1 || gh release create test --prerelease --target "$GITHUB_SHA" --title "Test sürümü" --notes "Her başarılı derlemede güncellenir."
            cp "out/$HUB-$VERSION_NAME-universal.apk" "$HUB-imzali-evrensel.apk"
            gh release upload test "$HUB-imzali-evrensel.apk" --clobber
          fi

  upload:
    needs: [gate, build]
    if: needs.gate.outputs.play == '1' && !(github.event_name == 'workflow_dispatch' && inputs.test_build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_CODE: ${{ needs.gate.outputs.code }}
      VERSION_NAME: ${{ needs.gate.outputs.name }}
      TRACK: ${{ needs.gate.outputs.track }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.HUB }}-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.HUB }}-symbols-${{ env.VERSION_CODE }}
          path: meta
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1
        with:
          ruby-version: "3.3"
      - run: gem install fastlane -N
      - name: AAB + sürüm notları + R8 eşlemesi -> ${{ env.TRACK }}
        # Hizmet hesabı anahtarı yalnızca yükleme adımlarında.
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_JSON_KEY }}
        run: |
          MAP=""; [ -f meta/mapping.txt ] && MAP="--mapping meta/mapping.txt"
          up() {
            fastlane supply --package_name "$PACKAGE" --track "$TRACK" --release_status "$1" \
              --aab "out/$HUB-$VERSION_NAME.aab" $MAP \
              --metadata_path fastlane/metadata/android \
              --skip_upload_metadata true --skip_upload_images true --skip_upload_screenshots true \
              --skip_upload_apk true 2>&1 | tee "$RUNNER_TEMP/supply.log"
            return ${PIPESTATUS[0]}
          }
          if up completed; then exit 0; fi
          if grep -qi "draft app" "$RUNNER_TEMP/supply.log"; then
            echo "Uygulama henüz taslak: sürüm 'draft' olarak yükleniyor (Play Console'dan yayınlayın)."
            up draft && exit 0
          fi
          if grep -qi "Package not found\|applicationNotFound\|404" "$RUNNER_TEMP/supply.log"; then
            echo "::error::Play'de $PACKAGE bulunamadı. Uygulamayı Play Console'da oluşturup ilk AAB'yi elle yükleyin (CANLI_HAZIRLIK.md, adım A4)."
          fi
          exit 1
      - name: Mağaza metinleri ve görseller (33 dil)
        if: github.event_name != 'workflow_dispatch' || inputs.metadata
        continue-on-error: true
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_JSON_KEY }}
        run: |
          pip install -q pillow
          python tool/generate_assets.py
          IMG="--skip_upload_images true --skip_upload_screenshots true"
          if gh release download store -R "$GITHUB_REPOSITORY" -p store-graphics.zip; then
            mkdir -p sg && (cd sg && unzip -q ../store-graphics.zip)
            python tool/play_prepare.py sg && IMG="--sync_image_upload true"
          else
            echo "::warning::'store' sürümünde store-graphics.zip yok: yalnızca metinler yükleniyor (store-shots iş akışını çalıştırın)."
          fi
          fastlane supply --package_name "$PACKAGE" --metadata_path fastlane/metadata/android \
            --skip_upload_apk true --skip_upload_aab true --skip_upload_changelogs true $IMG \
            || { echo "::warning::Mağaza metinleri/görselleri yüklenemedi (ikili paket yüklendi). Günlüğe bakın."; exit 1; }
