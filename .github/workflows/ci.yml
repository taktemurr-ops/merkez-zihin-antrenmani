name: CI - analyze, test, Android, Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for every job (read-only token).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Security - no secrets or keys committed
        run: python tool/check_secrets.py

      - name: Generate icons, splash, sounds and store graphics
        run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release signing key (only when the secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            # Yalnızca dosya yolu ortama yazılır; parolalar ortak ortama
            # (sonraki bütün adımlara) değil, yalnız derleme adımına verilir.
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: release build is signed with the debug key (test only)."
          fi

      - name: Create platform folders (android, ios, web) if missing
        env:
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
        run: |
          flutter create --platforms=android,ios,web --org com.gamestudio100 --project-name merkez_zihin_antrenmani .
          python tool/patch_platforms.py
          python tool/platforms_extra.py

      - run: flutter pub get

      - name: App icons and splash screens
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Dependency vulnerabilities (osv-scanner, pubspec.lock; report only)
        continue-on-error: true
        run: |
          curl -sSLo "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile=pubspec.lock --format=table || true

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit, rule, save and 24-month simulation tests
        run: flutter test --exclude-tags boyut --reporter expanded

      - name: Android release APK + App Bundle
        env:
          AD_INT: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL }}
          AD_REW: ${{ secrets.ADMOB_ANDROID_REWARDED }}
          FB_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_SENDER: ${{ secrets.FIREBASE_SENDER_ID }}
          FB_ANDROID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FB_WEB: ${{ secrets.FIREBASE_WEB_APP_ID }}
          PV_URL: ${{ secrets.PURCHASE_VERIFY_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Çevrimiçi özellikler yalnızca Firebase gizli değişkenleri tanımlıysa açılır.
          FB=""
          if [ -n "$FB_PROJECT" ]; then
            FB="--dart-define=FIREBASE_PROJECT_ID=$FB_PROJECT --dart-define=FIREBASE_API_KEY=$FB_KEY --dart-define=FIREBASE_SENDER_ID=$FB_SENDER --dart-define=FIREBASE_ANDROID_APP_ID=$FB_ANDROID --dart-define=FIREBASE_WEB_APP_ID=$FB_WEB"
          fi
          echo "FB_DEFS=$FB" >> "$GITHUB_ENV"
          # Gerçek reklam birimleri yalnızca gizli değişkenler tanımlıysa; yoksa test kimlikleri.
          DEFS="$FB"
          if [ -n "$AD_INT" ]; then DEFS="$DEFS --dart-define=ADMOB_ANDROID_INTERSTITIAL=$AD_INT"; fi
          if [ -n "$AD_REW" ]; then DEFS="$DEFS --dart-define=ADMOB_ANDROID_REWARDED=$AD_REW"; fi
          # Satın alma sunucu doğrulaması (server/purchase_verifier) tanımlıysa.
          if [ -n "$PV_URL" ]; then DEFS="$DEFS --dart-define=PURCHASE_VERIFY_URL=$PV_URL"; fi
          # Obfuscated release builds; symbols kept as a private artifact
          # for de-obfuscating crash reports.
          # One retry: Gradle plugin/Maven mirrors occasionally fail to resolve.
          # Play her yüklemede daha büyük bir sürüm kodu ister: derleme sırasından türetilir.
          BN=$((GITHUB_RUN_NUMBER + 100))
          # Play'e giden paket AAB'dir (Play her cihaza yalnızca kendi ABI'sini
          # indirir). Test APK'sı ABI başına ayrı üretilir: arm64-v8a (güncel
          # telefonlar) ve armeabi-v7a (eski 32 bit telefonlar).
          for t in "apk --split-per-abi --target-platform android-arm,android-arm64" appbundle; do
            flutter build $t --release $DEFS --build-number=$BN --obfuscate --split-debug-info=build/symbols/android \
              || (sleep 90 && flutter build $t --release $DEFS --build-number=$BN --obfuscate --split-debug-info=build/symbols/android) || (sleep 180 && flutter build $t --release $DEFS --build-number=$BN --obfuscate --split-debug-info=build/symbols/android)
          done
          ls -l build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab

      - name: Web build (also published on GitHub Pages for device testing)
        # PWA: CanvasKit yerel (CDN'siz), çevrimdışı service worker ve manifest.
        run: |
          flutter build web --release $FB_DEFS --no-web-resources-cdn --base-href "/merkez-zihin-antrenmani/"
          python tool/platforms_extra.py pwa build/web

      - name: Package web build for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merkez-zihin-antrenmani-android
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merkez-zihin-antrenmani-debug-symbols
          path: build/symbols
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merkez-zihin-antrenmani-web
          path: build/web
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merkez-zihin-antrenmani-store-graphics
          path: store/
          retention-days: 30

  # Playable web version on https://<owner>.github.io/merkez-zihin-antrenmani/ so every
  # phone, tablet and desktop browser can be tested without installing.
  # Needs Settings > Pages > Source = "GitHub Actions"; if Pages is off the
  # deploy is skipped without failing CI.
  # Test APK: tek tıkla indirilebilen sabit bağlantı (GitHub hesabı gerekmez).
  test-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: merkez-zihin-antrenmani-android
      - name: Publish to the "test" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '1' || '' }}
        run: |
          # merkez-zihin-antrenmani.apk = arm64-v8a (bağlantı aynı kalır); eski 32 bit
          # telefonlar için ayrıca -armeabi-v7a.apk.
          cp $(find . -name app-arm64-v8a-release.apk | head -1) merkez-zihin-antrenmani.apk
          cp $(find . -name app-armeabi-v7a-release.apk | head -1) merkez-zihin-antrenmani-armeabi-v7a.apk
          gh release view test >/dev/null 2>&1 || gh release create test --prerelease --target "$GITHUB_SHA" --title "Test sürümü" --notes "Her başarılı derlemede güncellenir."
          gh release upload test merkez-zihin-antrenmani.apk merkez-zihin-antrenmani-armeabi-v7a.apk --clobber
          # İmza anahtarı tanımlıysa Play'e yüklenecek paket (AAB) de aynı sürüme konur.
          if [ -n "$SIGNED" ]; then
            cp $(find . -name app-release.aab | head -1) merkez-zihin-antrenmani.aab
            gh release upload test merkez-zihin-antrenmani.aab --clobber
          fi
          gh release edit test --notes "Test sürümü — derleme ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M') UTC"

  # GitHub Pages yalnızca depoda açıksa yayımlanır (Settings > Pages >
  # Source = "GitHub Actions"). Kapalıyken iş atlanır, CI kırmızı olmaz.
  pages-check:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$bt" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages kapalı (ya da kaynak GitHub Actions değil): yayımlama atlandı." >> "$GITHUB_STEP_SUMMARY"
          fi

  pages:
    needs: [build, pages-check]
    if: needs.pages-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
