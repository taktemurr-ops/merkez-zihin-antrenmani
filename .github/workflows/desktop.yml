name: Desktop - Windows (MSIX) and macOS

# Masaüstü sürümü (Microsoft Store / Mac App Store): ücretli tam sürüm,
# reklamsız, premium açık (studio_core Edition.desktop). Ayrıntılar ve
# gerekli hesaplar/gizli değişkenler: ship/MASAUSTU_WEB.md.
#
# İmza yalnızca gizli değişkenler tanımlıysa yapılır; yoksa imzasız paketler
# üretilir ve "test" sürümüne zip olarak konur.
# Uzun ve pahalı (Windows + macOS) derleme: her push'ta değil; her gece,
# v* etiketinde ve elle (Actions > Desktop > Run workflow).
on:
  schedule:
    - cron: "17 2 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
  # (uzun masaüstü/portal derlemeleri sık push ile iptal olmasın; bekleyen en yeni çalışma kalır)

env:
  FLUTTER_VERSION: "3.47.9"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HUB: merkez-zihin-antrenmani
  PKG: merkez_zihin_antrenmani

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Icons, sounds (generated)
        run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Windows platform folder
        run: |
          flutter create --platforms=windows --org com.gamestudio100 --project-name $PKG .
          python tool/platforms_extra.py
          flutter pub get
          printf 'flutter_launcher_icons:\n  image_path: "assets/branding/icon.png"\n  windows:\n    generate: true\n    icon_size: 256\n' > desktop_icons.yaml
          dart run flutter_launcher_icons -f desktop_icons.yaml
      - name: Build (release, desktop edition)
        env:
          # VS 2026: eski /await eklentileri için (bkz. tool/platforms_extra.py).
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter build windows --release --dart-define=EDITION=desktop --build-number=$((GITHUB_RUN_NUMBER + 100)) \
            || (sleep 60 && flutter build windows --release --dart-define=EDITION=desktop --build-number=$((GITHUB_RUN_NUMBER + 100)))
      - name: MSIX (signed only with WINDOWS_CERT_PFX)
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          ID_NAME: ${{ vars.MSIX_IDENTITY_NAME || secrets.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || secrets.MSIX_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          flutter pub add --dev msix
          mkdir -p dist
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "tool")
          import patch_platforms as p
          e = os.environ
          pkg, hub = e["PKG"], e["HUB"]
          langs = ("en-us,tr-tr,de-de,es-es,fr-fr,ar-sa,fa-ir,he-il,ur-pk,ru-ru,uk-ua,pl-pl,cs-cz,ro-ro,hu-hu,"
                   "el-gr,it-it,pt-br,nl-nl,sv-se,da-dk,nb-no,fi-fi,ja-jp,ko-kr,zh-cn,hi-in,bn-bd,id-id,ms-my,"
                   "th-th,vi-vn,fil-ph")
          cfg = {
              "display_name": p.APP_NAME,
              "publisher_display_name": e.get("PUBLISHER_NAME") or "GameStudio100",
              "identity_name": e.get("ID_NAME") or ("com.gamestudio100." + pkg.replace("_", "")),
              "publisher": e.get("PUBLISHER") or "CN=GameStudio100Test",
              "msix_version": "1.0.%s.0" % e["GITHUB_RUN_NUMBER"],
              "logo_path": "assets/branding/icon.png",
              "capabilities": "internetClient",
              "languages": langs,
              "build_windows": "false",
              "output_path": "dist",
              "output_name": hub,
              "install_certificate": "false",
          }
          if e.get("PFX"):
              cfg["certificate_path"] = os.path.join(e["RUNNER_TEMP"], "cert.pfx")
              cfg["certificate_password"] = e.get("PFX_PASS", "")
              print("MSIX imzalanacak (WINDOWS_CERT_PFX).")
          elif e.get("ID_NAME") and e.get("PUBLISHER"):
              cfg["store"] = "true"
              print("Sertifika yok: Microsoft Store paketi (Store imzalar).")
          else:
              cfg["sign_msix"] = "false"
              print("Sertifika yok: imzasız MSIX (yalnızca test/inceleme).")
          def q(v):
              return v if v in ("true", "false") else '"%s"' % v.replace('"', "")
          with open("pubspec.yaml", "a", encoding="utf-8") as f:
              f.write("\nmsix_config:\n" + "".join("  %s: %s\n" % (k, q(v)) for k, v in cfg.items()))
          PY
          if [ -n "$PFX" ]; then echo "$PFX" | base64 -d > "$RUNNER_TEMP/cert.pfx"; fi
          tail -16 pubspec.yaml | grep -v certificate_password
          dart run msix:create
          ls -l dist
      - name: Package zips
        run: |
          cd build/windows/x64/runner/Release && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/$HUB-windows-x64.zip" . >/dev/null && cd -
          cd dist && 7z a -tzip "$HUB-windows-msix.zip" "$HUB.msix" >/dev/null && cd -
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HUB }}-windows
          path: |
            dist/${{ env.HUB }}-windows-x64.zip
            dist/${{ env.HUB }}-windows-msix.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Icons, sounds (generated)
        run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: macOS platform folder
        run: |
          flutter create --platforms=macos --org com.gamestudio100 --project-name $PKG .
          python tool/platforms_extra.py
          flutter pub get
          printf 'flutter_launcher_icons:\n  image_path: "assets/branding/icon.png"\n  macos:\n    generate: true\n' > desktop_icons.yaml
          dart run flutter_launcher_icons -f desktop_icons.yaml
      - name: Build (release, desktop edition)
        run: |
          flutter build macos --release --dart-define=EDITION=desktop --build-number=$((GITHUB_RUN_NUMBER + 100)) \
            || (sleep 60 && flutter build macos --release --dart-define=EDITION=desktop --build-number=$((GITHUB_RUN_NUMBER + 100)))
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          du -sh "$APP"
      - name: Sign, package (.pkg) and notarize (only with Apple secrets)
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          INSTALLER_PASS: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p dist
          if [ -n "$CERT_P12" ]; then
            KC="$RUNNER_TEMP/build.keychain"; KP="$(uuidgen)"
            security create-keychain -p "$KP" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KP" "$KC"
            echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/app.p12"
            security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/productbuild
            if [ -n "$INSTALLER_P12" ]; then
              echo "$INSTALLER_P12" | base64 -d > "$RUNNER_TEMP/inst.p12"
              security import "$RUNNER_TEMP/inst.p12" -k "$KC" -P "$INSTALLER_PASS" -T /usr/bin/productbuild
            fi
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
            if [ -n "$PROFILE" ]; then
              echo "$PROFILE" | base64 -d > "$APP/Contents/embedded.provisionprofile"
            fi
            IDENT=$(security find-identity -v -p codesigning "$KC" | grep -m1 -oE '"[^"]+"' | tr -d '"')
            echo "İmza kimliği: $IDENT"
            codesign --force --deep --options runtime --timestamp \
              --entitlements macos/Runner/Release.entitlements --sign "$IDENT" "$APP"
            codesign --verify --deep --strict "$APP"
            INST=$(security find-identity -v "$KC" | grep -m1 -oE '"(3rd Party Mac Developer Installer|Developer ID Installer|Mac Installer Distribution)[^"]*"' | tr -d '"' || true)
            if [ -n "$INST" ]; then
              productbuild --component "$APP" /Applications --sign "$INST" "dist/$HUB-macos.pkg"
            else
              productbuild --component "$APP" /Applications "dist/$HUB-macos.pkg"
            fi
            # Developer ID ile imzalandıysa noterlik (App Store dışı dağıtım).
            if [ -n "$ASC_KEY_ID" ] && echo "$IDENT" | grep -q "Developer ID"; then
              echo "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
              ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notary.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notary.zip" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
              xcrun stapler staple "$APP"
            fi
          else
            echo "Apple imza sertifikası yok: imzasız .app ve .pkg (yalnızca test)."
            productbuild --component "$APP" /Applications "dist/$HUB-macos.pkg"
          fi
          ditto -c -k --keepParent "$APP" "dist/$HUB-macos-app.zip"
          (cd dist && ditto -c -k "$HUB-macos.pkg" "$HUB-macos-pkg.zip")
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HUB }}-macos
          path: |
            dist/${{ env.HUB }}-macos-app.zip
            dist/${{ env.HUB }}-macos-pkg.zip
          if-no-files-found: error
          retention-days: 14

  # Zip'ler "test" sürümüne (GitHub hesabı olmadan indirilebilir bağlantı).
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the "test" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view test >/dev/null 2>&1 || gh release create test --prerelease --target "$GITHUB_SHA" --title "Test sürümü" --notes "Her başarılı derlemede güncellenir." || true
          gh release upload test dist/*.zip --clobber
