name: Device smoke test (Android phone + tablet emulator, iPhone + iPad simulator)

# Installs the real app on emulators/simulators, launches it, rotates it,
# sends it to the background and back, switches to Arabic (right-to-left),
# drives the UI with random taps (Android monkey) and, for app hubs, runs an
# on-device test that opens tools from every category. Fails on crashes /
# ANR of our package or layout errors. Screenshots of every step are kept.
# The wide device matrix (API 24-36, foldable, tablet, iPhone SE, iPad) is in
# device-matrix.yml (manual + weekly).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_7, pixel_tablet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          flutter create --platforms=android,ios,web --org com.gamestudio100 --project-name merkez_zihin_antrenmani .
          python tool/patch_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build release APK
        run: flutter build apk --release || (sleep 90 && flutter build apk --release) || (sleep 180 && flutter build apk --release)
      - name: Build on-device test APK (app hubs)
        run: |
          if [ -f integration_test/device_smoke_test.dart ]; then
            T="-t integration_test/device_smoke_test.dart"
            flutter build apk --debug $T || (sleep 90 && flutter build apk --debug $T)
          fi
      # Emülatöre yer açmak için derlemeden kalan Gradle/Kotlin süreçleri durdurulur
      # (ana makinede bellek yetmezse emülatör sessizce öldürülüyor).
      - name: Free host memory for the emulator
        run: |
          (cd android && ./gradlew --stop) > /dev/null 2>&1 || true
          pkill -f KotlinCompileDaemon || true
          pkill -f GradleDaemon || true
          free -m
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (${{ matrix.profile }})
        id: emu1
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 3
          ram-size: 3072M
          heap-size: 576M
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          disable-animations: true
          script: bash tool/smoke_android.sh ${{ matrix.profile }}
      # Altyapı kaynaklı (adb offline / emülatör çöktü) aksaklıklara karşı
      # temiz bir emülatörde (Vulkan açık, varsayılan grafik yolu) bir kez daha;
      # gerçek çökme iki denemede de düşer.
      - name: Retry on a fresh emulator (${{ matrix.profile }})
        if: steps.emu1.outcome == 'failure'
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 3
          ram-size: 3072M
          heap-size: 576M
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/smoke_android.sh ${{ matrix.profile }}-retry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merkez-zihin-antrenmani-smoke-android-${{ matrix.profile }}
          path: smoke/
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          flutter create --platforms=android,ios,web --org com.gamestudio100 --project-name merkez_zihin_antrenmani .
          python tool/patch_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build for simulator
        run: flutter build ios --simulator --debug
      - name: Run on iPhone and iPad simulators
        run: bash tool/smoke_ios.sh "iPhone|iPad"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merkez-zihin-antrenmani-smoke-ios
          path: smoke/
          retention-days: 14
