name: Screen sizes (320x568 .. 1280x800, large text, RTL)

# Ekran boyutları: merkez ekranları ve her oyunun/aracın açılış ekranı
# 320x568'den 1280x800 yatay tablete, büyük yazı (1.3x) ve sağdan sola dilde:
# taşma, kesik metin, ekran dışında kalan düğme olmamalı.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sizes-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  screen-sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fonts with real metrics (Arabic, emoji)
        run: sudo apt-get install -yq fonts-noto-core fonts-noto-color-emoji > /dev/null || (sudo apt-get update -q && sudo apt-get install -yq fonts-noto-core fonts-noto-color-emoji > /dev/null)
      - run: flutter pub get
      - name: Screen size, large text and RTL layout tests
        run: |
          set -o pipefail
          flutter test --tags boyut --reporter expanded 2>&1 | tee sizes.log
      - name: Summary
        if: always()
        run: |
          grep -E "^(BOYUT|SORUN)" sizes.log | head -300 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screen-sizes-log
          path: sizes.log
          retention-days: 14
