name: Nightly endurance (levels 1-10000, 50.000 sample, 24-month simulation)

on:
  schedule:
    - cron: "17 2 * * 1"   # weekly, Monday 02:17 UTC (keeps Actions minutes low)
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Long level validation and soak tests
        run: flutter test --dart-define=LONG=true test/long_run_test.dart test/soak_test.dart
